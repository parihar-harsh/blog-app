name = "medium-blogapp"
compatibility_date = "2023-12-01"

# Configure runtime values without committing them:
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put JWT_SECRET

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60
